<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Макарова ліс — обхід</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5/index.css" />
<link rel="stylesheet" href="style.css" />

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.module.js",
    "@photo-sphere-viewer/markers-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5/index.module.js"
  }
}
</script>
</head>
<body>

<div id="app">

  <!-- 2D-карта: лінія маршруту + клікабельні точки-панорами -->
  <div id="map-view"></div>

  <!-- Top HUD -->
  <header id="hud-top">
    <div class="hud-panel" id="title-panel">
      <span class="eyebrow">LiDAR обхід</span>
      <h1>Макарова ліс</h1>
      <div class="stat-row">
        <span class="stat"><strong id="stat-panoramas">0</strong> панорам</span>
        <span class="stat-dot">•</span>
        <span class="stat" id="stat-hint">клікніть точку на карті</span>
      </div>
    </div>
    <button id="reset-view" class="icon-btn" title="Показати весь маршрут" aria-label="Показати весь маршрут">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm16 0v6h-6v-2h4v-4h2z" fill="currentColor"/></svg>
    </button>
  </header>

  <!-- Loading overlay -->
  <div id="loading">
    <div class="loader-mark"></div>
    <p id="loading-status">Ініціалізація…</p>
  </div>

  <!-- Fullscreen panorama overlay -->
  <div id="panorama-view">
    <div id="panorama-container"></div>

    <div id="pano-topbar">
      <button id="pano-close" class="icon-btn" aria-label="Закрити панораму, повернутись до карти">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 10.6 5.4 4 4 5.4 10.6 12 4 18.6 5.4 20 12 13.4 18.6 20 20 18.6 13.4 12 20 5.4 18.6 4z" fill="currentColor"/></svg>
      </button>
      <div id="pano-caption" class="caption-pill"></div>
    </div>

    <button id="pano-prev" class="nav-arrow nav-arrow--left" aria-label="Попередня панорама">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M15.5 4 6 12l9.5 8 1.4-1.4L8.8 12l8.1-6.6z" fill="currentColor"/></svg>
    </button>
    <button id="pano-next" class="nav-arrow nav-arrow--right" aria-label="Наступна панорама">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M8.5 4 7.1 5.4l8.1 6.6-8.1 6.6L8.5 20 18 12z" fill="currentColor"/></svg>
    </button>

    <!-- Мінікарта: показує положення на маршруті прямо під час перегляду
         панорами, і по ній теж можна клікнути іншу точку -->
    <div id="mini-map-panel" class="hud-panel">
      <span id="mini-map-label">Маршрут</span>
      <div id="mini-map"></div>
    </div>
  </div>

  <!-- Iris / aperture transition -->
  <div id="iris"></div>

</div>

<script type="module" src="main.js"></script>
</body>
</html>
